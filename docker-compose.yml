version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datastraw_postgres
    environment:
      POSTGRES_DB: datastraw_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datastraw_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/datastraw_crm
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80"]'
      ENVIRONMENT: development
      API_PREFIX: /api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datastraw_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: