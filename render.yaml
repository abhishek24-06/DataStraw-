services:
  - type: web
    name: datastraw-crm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datastraw-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://your-frontend-domain.vercel.app","http://localhost:5173","http://localhost:3000"]'
      - key: ENVIRONMENT
        value: production
      - key: API_PREFIX
        value: /api
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: datastraw-db
    databaseName: datastraw_crm
    user: datastraw
    plan: free